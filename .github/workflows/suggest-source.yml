name: Suggest-source check

# First-pass check of "Suggest a source" issues: parses the form, normalises
# the URL, looks for duplicates (archived sources included), validates the
# fields and fetches the link once. It posts or updates ONE comment. It never
# accepts, labels, closes or edits an issue, and never edits sources.
#
# Security model (the issue text is untrusted; anyone can open an issue):
# - `issues` events always run this file and the checkout from the default
#   branch, so only reviewed code runs. Nothing from a fork or pull request is
#   checked out or executed.
# - The issue body reaches the script only through an environment variable,
#   never a shell command line or a `${{ }}` expression inside a script.
# - The job that parses the body and fetches the link has a read-only token
#   that is not persisted. Only the separate `comment` job can write, and it
#   runs no repository code: it posts the report text the first job produced.
on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: suggest-source-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    # Only issues from the suggest-source form: its title prefix and the
    # "Canonical URL" heading every form body contains (labels may not exist).
    if: >-
      startsWith(github.event.issue.title, '[Source]') &&
      contains(github.event.issue.body, '### Canonical URL')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      applicable: ${{ steps.check.outputs.applicable }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The issue body reaches the script only through the environment, never
      # through the shell command line.
      - name: Check the suggestion
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPORT_PATH: ${{ runner.temp }}/suggest-source-report.md
        run: node web/scripts/suggest-source-check.mjs

      # Hands the report to the comment job as a job output. A random
      # delimiter keeps report text from ending the value early.
      - name: Pass the report on
        id: report
        if: steps.check.outputs.applicable == 'true'
        env:
          REPORT_PATH: ${{ runner.temp }}/suggest-source-report.md
        run: |
          delimiter="REPORT_$(openssl rand -hex 16)"
          {
            echo "report<<${delimiter}"
            cat "$REPORT_PATH"
            echo
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  comment:
    needs: check
    if: needs.check.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post or update the summary comment
        uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.check.outputs.report }}
        with:
          script: |
            const marker = "<!-- tessli:suggest-source-check -->";
            const body = process.env.REPORT.trim();
            if (!body.startsWith(marker)) {
              core.setFailed("The report does not start with the check's marker.");
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            // Only this workflow's own comment is updated; a pasted marker in
            // someone else's comment is ignored.
            const previous = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
